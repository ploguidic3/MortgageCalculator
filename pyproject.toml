[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-snow-sync"
version = "0.1.0"
description = "One-way sync from AuditBoard Policy Management to ServiceNow Knowledge Base"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
]

[project.scripts]
ab-snow-sync = "ab_snow_sync.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
